name: Apply Admin Bet Delete

on:
  push:
    paths:
      - '.github/scripts/patch_admin_delete_bet.py'
      - '.github/workflows/apply-admin-delete-bet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch betting admin delete control
        run: python .github/scripts/patch_admin_delete_bet.py
      - name: Validate
        run: |
          grep -q "🗑 מחק טיקט" betting.html
          ! grep -q "alert(" betting.html
          ! grep -q "confirm(" betting.html
          ! grep -q "prompt(" betting.html
      - name: Commit changes
        run: |
          if git diff --quiet -- betting.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add betting.html
          git commit -m "Add delete control to all bets admin"
          git push
