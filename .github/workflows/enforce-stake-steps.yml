name: Enforce Stake Steps
on:
  push:
    paths:
      - '.github/scripts/enforce_stake_steps.py'
      - '.github/workflows/enforce-stake-steps.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply stake step validation
        run: python .github/scripts/enforce_stake_steps.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('betting.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Commit changes
        run: |
          if git diff --quiet -- betting.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add betting.html
          git commit -m 'Require bet stakes in 1000 increments'
          git push
