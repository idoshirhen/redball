name: Disable My Bets Auto Refresh
on:
  push:
    paths:
      - '.github/scripts/disable_mybets_auto_refresh.py'
      - '.github/workflows/disable-mybets-auto-refresh.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable My Bets 30-second refresh
        run: python .github/scripts/disable_mybets_auto_refresh.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('betting.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/betting.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/betting.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add betting.html
          git diff --cached --quiet && exit 0
          git commit -m "Disable automatic My Bets refresh"
          git push
