name: Apply Red Ball Design Polish

on:
  push:
    paths:
      - '.github/workflows/apply-redball-design-polish.yml'
      - '.github/scripts/patch_redball_design.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply approved card and order panel polish
        run: python .github/scripts/patch_redball_design.py

      - name: Commit updated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish product cards and order panel"
          git push
