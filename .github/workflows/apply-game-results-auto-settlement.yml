name: Apply Game Results Auto Settlement

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_game_results_auto_settlement.py'
      - '.github/workflows/apply-game-results-auto-settlement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply game result UI
        run: python .github/scripts/add_game_results_auto_settlement.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('betting.html').read_text(encoding='utf-8')
          start=s.find('<script>')
          end=s.rfind('</script>')
          js=s[start+8:end]
          Path('/tmp/betting.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/betting.js
      - name: Commit changes
        run: |
          if git diff --quiet -- betting.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add betting.html
          git commit -m "Add game result tracking and auto settle bets"
          git push
