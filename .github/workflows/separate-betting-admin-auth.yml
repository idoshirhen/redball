name: Separate Betting Admin Auth
on:
  push:
    paths:
      - '.github/scripts/separate_betting_admin_auth.py'
      - '.github/workflows/separate-betting-admin-auth.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply betting admin auth separation
        run: python .github/scripts/separate_betting_admin_auth.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('betting.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*)</script>\s*</body>',s)
          if not m: raise SystemExit('script block not found')
          Path('/tmp/betting.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/betting.js
      - name: Commit changes
        run: |
          if git diff --quiet -- betting.html; then
            echo 'No betting.html changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add betting.html
          git commit -m 'Separate betting admin authentication'
          git push
