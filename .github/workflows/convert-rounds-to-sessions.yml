name: Convert Betting Rounds To Sessions

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/convert_rounds_to_sessions.py'
      - '.github/workflows/convert-rounds-to-sessions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply named sessions UI
        run: python .github/scripts/convert_rounds_to_sessions.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('betting.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/betting-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/betting-inline.js
      - name: Commit changes
        run: |
          if git diff --quiet -- betting.html; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add betting.html
          git commit -m 'Replace betting rounds with named sessions'
          git push
