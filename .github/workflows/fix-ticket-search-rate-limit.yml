name: Fix Ticket Search Rate Limit
on:
  push:
    paths:
      - '.github/scripts/fix_ticket_search_rate_limit.py'
      - '.github/workflows/fix-ticket-search-rate-limit.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ticket search fix
        run: python .github/scripts/fix_ticket_search_rate_limit.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('betting.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/betting-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/betting-inline.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add betting.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix My Bets ticket search rate limiting'
          git push
