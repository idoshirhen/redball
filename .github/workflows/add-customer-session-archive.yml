name: Add Customer Session Archive

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_customer_session_archive.py'
      - '.github/workflows/add-customer-session-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply customer archive patch
        run: python .github/scripts/add_customer_session_archive.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('betting.html').read_text(encoding='utf-8')
          start=s.rfind('<script>')
          end=s.rfind('</script>')
          if start<0 or end<0 or end<=start:
              raise SystemExit('script block not found')
          Path('/tmp/betting.js').write_text(s[start+8:end],encoding='utf-8')
          PY
          node --check /tmp/betting.js
      - name: Commit betting.html
        run: |
          if git diff --quiet -- betting.html; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add betting.html
          git commit -m 'Add customer session archive and locked results'
          git push
