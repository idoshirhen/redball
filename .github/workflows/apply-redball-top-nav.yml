name: Apply Red Ball UX Improvements

on:
  push:
    paths:
      - '.github/workflows/apply-redball-top-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply UX improvements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          marker = 'RED-BALL-UX-V2'

          if marker in s:
              print('UX improvements already applied.')
              raise SystemExit(0)

          # 2) Reserve room for the fixed order panel on medium desktop widths,
          # without changing the order panel itself.
          responsive_css = r'''
          /* RED-BALL-UX-V2 */
          @media (min-width:901px) and (max-width:1450px){
            .sections-wrapper,
            .categoryTabs{
              width:calc(100% - 290px);
              max-width:1100px;
              margin-left:auto;
              margin-right:10px;
            }
          }
          '''
          anchor = '\n/* ADMIN */'
          if anchor not in s:
              raise SystemExit('Could not find CSS insertion point')
          s = s.replace(anchor, '\n' + responsive_css + anchor, 1)

          # 3) Rename the all-products state from "תפריט" to "הכל".
          s = s.replace('let activeMenuCategory="תפריט";', 'let activeMenuCategory="הכל";', 1)
          s = s.replace('if(activeMenuCategory!=="תפריט" && category!==activeMenuCategory) continue;', 'if(activeMenuCategory!=="הכל" && category!==activeMenuCategory) continue;', 1)
          s = s.replace('if(activeMenuCategory!=="תפריט"){', 'if(activeMenuCategory!=="הכל"){', 1)

          # 4) Add small icons to category tabs while keeping category keys unchanged.
          render_pattern = re.compile(
              r'function renderCategoryTabs\(\)\{.*?\n\}\n\nfunction setMenuCategory\(category\)\{',
              re.S
          )
          render_replacement = r'''function renderCategoryTabs(){
            const tabs=document.getElementById("categoryTabs");
            if(!tabs) return;

            const categoryIcons={
              "משחקים":"🎱",
              "מבצעים":"🔥",
              "שתיה קלה":"🥤",
              "אוכל":"🌭",
              "שתיה חריפה":"🍸",
              "צייסרים ובירות":"🍺",
              "בקבוקים":"🍾"
            };

            const categories=[
              {key:"הכל", label:"📋 הכל"},
              ...Object.keys(menuData).map(key=>({
                key,
                label:`${categoryIcons[key] || "•"} ${key}`
              }))
            ];

            tabs.innerHTML=categories.map(category=>`
              <button class="categoryTab ${category.key===activeMenuCategory ? "active" : ""}"
                      onclick="setMenuCategory('${escapeJs(category.key)}')">
                ${category.label}
              </button>
            `).join("");
          }

          function setMenuCategory(category){'''
          s, count = render_pattern.subn(render_replacement, s, count=1)
          if count != 1:
              raise SystemExit('Could not replace category tab renderer')

          # 7) Warn before switching employee if an order is active.
          old_switch = '''function switchEmployee(){
            localStorage.removeItem("redball_employee");
            currentEmployee="";
            showLogin();
          }'''
          new_switch = '''function switchEmployee(){
            if(hasItems() && !confirm("יש הזמנה פעילה. לעבור עובד בכל זאת?")) return;
            localStorage.removeItem("redball_employee");
            currentEmployee="";
            showLogin();
          }'''
          if old_switch not in s:
              raise SystemExit('Could not find switchEmployee function')
          s = s.replace(old_switch, new_switch, 1)

          # 6) Warn before manual reset, but do not interrupt the automatic reset
          # after a successfully saved attendance order.
          old_reset = '''function resetAll(){
            for(let item in cart){
              cart[item]=0;
              const qtyEl=document.getElementById("qty_"+safeId(item));
              if(qtyEl) qtyEl.innerText=0;
              let card=document.getElementById("card_"+safeId(item));
              if(card)card.classList.remove("active");
            }
            tipPercent=0;
            document.querySelectorAll(".tip-btn").forEach(b=>b.classList.remove("tip-active"));
            updateTotal();
          }'''
          new_reset = '''function resetAll(skipConfirm=false){
            if(!skipConfirm && hasItems() && !confirm("לאפס את ההזמנה הנוכחית?")) return false;
            for(let item in cart){
              cart[item]=0;
              const qtyEl=document.getElementById("qty_"+safeId(item));
              if(qtyEl) qtyEl.innerText=0;
              let card=document.getElementById("card_"+safeId(item));
              if(card)card.classList.remove("active");
            }
            tipPercent=0;
            document.querySelectorAll(".tip-btn").forEach(b=>b.classList.remove("tip-active"));
            updateTotal();
            return true;
          }'''
          if old_reset not in s:
              raise SystemExit('Could not find resetAll function')
          s = s.replace(old_reset, new_reset, 1)

          save_reset = '''  resetAll();
            alert("ההזמנה הועתקה להתפקדות, נשמרה במאגר ואופסה ✅");'''
          save_reset_new = '''  resetAll(true);
            alert("ההזמנה הועתקה להתפקדות, נשמרה במאגר ואופסה ✅");'''
          if save_reset not in s:
              raise SystemExit('Could not find automatic reset after save')
          s = s.replace(save_reset, save_reset_new, 1)

          path.write_text(s, encoding='utf-8')
          print('Red Ball UX improvements applied successfully.')
          PY

      - name: Commit updated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve Red Ball category UX and safety prompts"
          git push
