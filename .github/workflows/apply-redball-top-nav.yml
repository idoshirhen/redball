name: Apply Red Ball Security Improvements

on:
  push:
    paths:
      - '.github/workflows/apply-redball-top-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply security patch
        run: python .github/scripts/patch_redball_security.py

      - name: Verify security syntax
        run: python .github/scripts/fix_redball_security_syntax.py

      - name: Commit updated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Red Ball security integration"
          git push
