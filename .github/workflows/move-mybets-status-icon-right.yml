name: Move My Bets Status Icon Right
on:
  push:
    paths:
      - '.github/workflows/move-mybets-status-icon-right.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move outcome icons
        run: python .github/scripts/move_mybets_status_icon_right.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('betting.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/betting.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/betting.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add betting.html
          git commit -m 'Move My Bets outcome icons to right' || exit 0
          git push