name: Move Admin Delete Button

on:
  push:
    paths:
      - '.github/scripts/move_admin_delete_button.py'
      - '.github/workflows/move-admin-delete-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move delete button next to status
        run: python .github/scripts/move_admin_delete_button.py
      - name: Commit changes
        run: |
          if git diff --quiet -- betting.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add betting.html
          git commit -m "Move admin bet delete button next to status"
          git push
