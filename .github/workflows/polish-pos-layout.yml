name: Polish POS Layout
on:
  push:
    paths:
      - '.github/scripts/polish-pos-layout.py'
      - '.github/workflows/polish-pos-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply POS polish
        run: python .github/scripts/polish-pos-layout.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          print(f'inline script blocks: {len(blocks)}')
          PY
          node --check /tmp/index-inline.js
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish POS categories and branding'
          git push origin main
