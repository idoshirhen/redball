*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial}.w{max-width:1180px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #333;padding-bottom:14px}.brand{font-size:28px;font-weight:800;color:#6ed8ff}.tabs{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer}.tab,.ghost{background:#191919;color:white;border:1px solid #444;border-radius:9px;padding:10px 14px}.active{background:#ff4de1!important}.hero{text-align:center;padding:20px}.hero p,.muted{color:#999}.layout{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}.panel{background:#111;border:1px solid #333;border-radius:14px;padding:14px}.game{background:#171717;border:1px solid #333;border-radius:12px;padding:14px;margin-bottom:12px}.teams{font-size:18px;font-weight:bold;margin:7px 0 12px}.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}.odd{background:#222;border:1px solid #444;color:white;border-radius:9px;padding:9px}.odd b{display:block;color:#6ed8ff;font-size:17px}.odd.sel{border-color:#6ed8ff;background:#16313a}.ticket{position:sticky;top:10px}.pick{padding:9px 0;border-bottom:1px solid #333;font-size:13px}label{display:block;color:#aaa;font-size:13px;margin:12px 0 5px}input{width:100%;background:#181818;color:white;border:1px solid #444;border-radius:9px;padding:12px;font-size:16px}.calc{background:#0c1d22;border:1px solid #24515f;border-radius:10px;padding:12px;margin-top:12px;line-height:1.8}.win{font-size:22px;font-weight:bold;color:#6ed8ff}.primary{width:100%;margin-top:12px;background:#ff4de1;border:0;color:white;border-radius:9px;padding:13px;font-weight:bold}.small{font-size:12px;color:#aaa;line-height:1.5}@media(max-width:800px){.layout{grid-template-columns:1fr}.ticket{position:static}header{flex-direction:column;align-items:flex-start}}</style></head><body><div class="w"><header><div class="brand">🎲 הימורי Red Ball</div><div class="tabs"><a href="./" class="ghost" style="text-decoration:none">← חזרה ל-Red Ball</a><button class="ghost" onclick="location.href='./'">👤 עובדים דרך האתר הראשי</button></div></header><div class="hero"><h1>לוח המשחקים</h1><p>בחר תוצאה, הזן שם וסכום ושלח לעובדי Red Ball</p></div><div class="layout"><main class="panel" id="games"><div class="muted">טוען משחקים...</div></main><aside class="panel ticket"><h2>🎫 טופס ההימור</h2><div id="picks" class="muted">עדיין לא נבחרו משחקים</div><label>השם שלך במשחק</label><input id="name" placeholder="השם במשחק"><label>סכום ההימור</label><input id="stake" type="number" min="1" value="500"><div class="calc">יחס כולל: <b id="ratio">1.00</b><br>סכום: <b id="sum">500</b><br>זכייה אפשרית:<div id="win" class="win">500</div></div><button id="send" class="primary">שלח הימור לעובדים</button><p id="msg" class="small">לאחר השליחה, עובד Red Ball יגבה ממך את הסכום במשחק ויאשר את ההימור.</p></aside></div></div><script>
const URL="https://eqtgyxabuosyinnhairr.supabase.co",KEY="sb_publishable_NGc9M7HpJ4biIkTLSys-nw_qj1N2ZtA",db=supabase.createClient(URL,KEY),sel=new Map();let games=[];
